line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "W", "UP", "B"]

[lint.isort]
known-first-party = ["app"]

[lint.flake8-bugbear]
# FastAPI usa Depends/Header/Query/etc. em argumentos default por design.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Header",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
]
