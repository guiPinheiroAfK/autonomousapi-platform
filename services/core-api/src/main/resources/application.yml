server:
  port: 8080

spring:
  application:
    name: core-api
  datasource:
    url: ${CORE_DB_URL:jdbc:postgresql://localhost:5432/autonomousapi}
    username: ${CORE_DB_USER:autonomousapi}
    password: ${CORE_DB_PASSWORD:autonomousapi}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway é a fonte de verdade do schema (ADR 0004). Hibernate só valida.
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: core
  flyway:
    enabled: true
    schemas: core
    default-schema: core
    create-schemas: true
    locations: classpath:db/migration
  # Confirmação de e-mail (ADR 0011). Sem MAIL_SMTP_HOST (padrão dev/demo), nenhuma
  # propriedade spring.mail.* fica setada, o Spring Boot não autoconfigura JavaMailSender
  # nenhum, e o SmtpEmailSender (que depende dele) simplesmente não vira bean — cai no
  # LoggingEmailSender, que loga o link em vez de falhar.
  mail:
    host: ${MAIL_SMTP_HOST:}
    port: ${MAIL_SMTP_PORT:587}
    username: ${MAIL_SMTP_USER:}
    password: ${MAIL_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Timeout curto de propósito: o Redis aqui é acessório (rate limit e cache). Se ele
      # estiver lento ou fora, a requisição segue sem ele em vez de arrastar o usuário.
      timeout: 300ms
      connect-timeout: 300ms

# core-api é dono EXCLUSIVO do schema core; NUNCA cria/altera objeto do schema geo (ADR 0004).

app:
  jwt:
    # Mínimo 32 bytes para HS256. Em produção, injetar via secrets manager (spec 04). NUNCA commitar.
    secret: ${CORE_JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
    access-ttl-minutes: ${CORE_JWT_ACCESS_TTL_MIN:15}
    refresh-ttl-days: ${CORE_JWT_REFRESH_TTL_DAYS:30}
  geo-api:
    # core-api é o ÚNICO chamador do geo-api (spec 01). Token de serviço != token de usuário.
    base-url: ${GEO_API_URL:http://localhost:8000}
    service-token: ${GEO_SERVICE_TOKEN:dev-service-token-change-me}
  fipe:
    # API pública/gratuita (spec 06 item 2) — sem chave. VehicleFipeSyncJob é o único chamador.
    base-url: ${FIPE_API_BASE_URL:https://parallelum.com.br/fipe/api/v1}
  billing:
    # Billing web-first via Stripe Checkout (spec 03). Sem chave configurada (padrão dev/demo),
    # o endpoint de checkout responde 503 com mensagem clara em vez de tentar chamar a Stripe.
    stripe-secret-key: ${STRIPE_SECRET_KEY:}
    stripe-webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    stripe-price-id: ${STRIPE_PRICE_ID:}
    web-app-url: ${WEB_APP_URL:http://localhost:5180}
  rate-limit:
    # Tentativas de login por janela, POR E-MAIL e POR IP (contadas separadamente).
    # 10/minuto não atrapalha quem errou a senha algumas vezes, mas mata força bruta.
    login-max-attempts: ${LOGIN_MAX_ATTEMPTS:10}
    login-window-seconds: ${LOGIN_WINDOW_SECONDS:60}
  mail:
    # Remetente do e-mail de verificação (ADR 0011) — provedores SMTP reais costumam
    # exigir que bata com o domínio autenticado, então fica configurável.
    from: ${MAIL_FROM:no-reply@autonomousapi.com.br}
  auth:
    web-app-url: ${WEB_APP_URL:http://localhost:5180}
    email-verification-ttl-hours: ${EMAIL_VERIFICATION_TTL_HOURS:24}
    # Bem mais curto que o de verificação de e-mail: um link de redefinição de senha
    # interceptado vale mais a um atacante do que um link de confirmação de cadastro.
    password-reset-ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:60}
    # Convite de motorista dura mais que a confirmação de cadastro: o motorista pode
    # levar dias para abrir o e-mail e instalar o app (ADR 0013).
    driver-invite-ttl-hours: ${DRIVER_INVITE_TTL_HOURS:72}
    # Convite de equipe (spec 15) — mesmo raciocínio do convite de motorista: dias, não
    # horas, pra não expirar antes da pessoa abrir o e-mail.
    team-invite-ttl-hours: ${TEAM_INVITE_TTL_HOURS:72}
    # Login/cadastro com Google — sem client ID configurado (padrão dev/demo), o endpoint
    # responde 503 com mensagem clara em vez de tentar verificar contra um audience vazio.
    google-client-id: ${GOOGLE_CLIENT_ID:}
  telegram:
    # Notificação automática ao passageiro (spec 14) — sem token configurado (padrão
    # dev/demo), a mensagem só cai no log (LoggingPassengerNotificationSender).
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    # Nome de usuário do bot (sem @), pra montar o deep-link t.me/<bot-username>?start=<token>.
    bot-username: ${TELEGRAM_BOT_USERNAME:}
    # Validado contra o header X-Telegram-Bot-Api-Secret-Token — configurado junto do
    # setWebhook na Telegram (parâmetro secret_token). Sem isso, qualquer um podia forjar
    # POST /v1/telegram/webhook fingindo ser a Telegram.
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        # health/metrics/prometheus: o mínimo pra enxergar pool HikariCP, GC e latência
        # por endpoint durante um teste de carga. Nada de env/beans/heapdump aqui.
        include: health,metrics,prometheus
  endpoint:
    health:
      # "always": rota já é pública (sem JWT) pra facilitar o teste de carga, então
      # "when-authorized" nunca mostraria detalhe nenhum — só o status agregado.
      show-details: always
  health:
    mail:
      # Sem MAIL_SMTP_HOST é o padrão em dev/demo (cai no LoggingEmailSender, ver
      # comentário em spring.mail acima) — não é uma falha real, então não deve
      # derrubar o status agregado de /actuator/health.
      enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        # Sem isso, http.server.requests só dá média — que esconde a cauda (p95/p99)
        # que é exatamente o que interessa num teste de carga.
        http.server.requests: true
