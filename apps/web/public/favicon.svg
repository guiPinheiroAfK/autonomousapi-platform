  <path d="M52 51 L40.4 15" stroke="#f0a23a" stroke-width="3.6" stroke-linecap="round" />

  <rect x="28.6" y="40.2" width="4.8" height="10.4" rx="2.4" fill="#f0a23a" />
  <rect x="29.3" y="27.4" width="3.3" height="7.1" rx="1.65" fill="#f0a23a" />
  <rect x="29.85" y="18.2" width="2.15" height="4.8" rx="1.075" fill="#f0a23a" />
</svg>
