<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AutonomousAPI">
  <!-- Fundo quadrado arredondado na cor da superfície pública (--breu): favicon SVG não
       herda CSS da página, então as cores precisam ser fixas aqui, não currentColor. -->
