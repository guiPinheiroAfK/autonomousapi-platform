name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# paths-filter, em pull_request, lista os arquivos alterados via API do GitHub —
# precisa de pull-requests:read (senão dá "Resource not accessible by integration"
# em repo privado). No push ele usa git diff e não precisaria, mas manter aqui é seguro.
permissions:
  contents: read
  pull-requests: read

# Pipeline por escopo (spec 04): um job de detecção decide o que mudou e só os
# jobs afetados rodam — evita build lento em monorepo.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      core-api: ${{ steps.filter.outputs.core-api }}
      geo-api: ${{ steps.filter.outputs.geo-api }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/shared-types/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
            mobile:
              - 'apps/mobile/**'
              - 'packages/shared-types/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
            core-api:
              - 'services/core-api/**'
            geo-api:
              - 'services/geo-api/**'
            contracts:
              - 'packages/contracts/**'

  web:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace @autonomousapi/web
      - run: npm run typecheck
      - run: npm run test --workspace @autonomousapi/web
      - run: npm run build:web

  mobile:
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace @autonomousapi/mobile
      - run: npm run test --workspace @autonomousapi/mobile

  core-api:
    needs: changes
    if: ${{ needs.changes.outputs.core-api == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-api
    # Postgres de verdade para os testes de integração. Poderia ficar a cargo do
    # Testcontainers (que é o fallback quando CORE_TEST_DB_URL não existe), mas o
    # service container sobe antes do job e é o mesmo caminho verificado localmente.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: autonomousapi
          POSTGRES_PASSWORD: autonomousapi
          POSTGRES_DB: autonomousapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CORE_TEST_DB_URL: jdbc:postgresql://localhost:5432/autonomousapi_test
      CORE_TEST_DB_USER: autonomousapi
      CORE_TEST_DB_PASSWORD: autonomousapi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      # `cache: maven` acima só cobre ~/.m2/repository (dependências). A distribuição
      # do Maven Wrapper baixada do Maven Central fica em ~/.m2/wrapper/dists — sem
      # cachear isso, todo run bate no Maven Central e pode pegar rate limit (HTTP 429).
      - uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('services/core-api/.mvn/wrapper/maven-wrapper.properties') }}
      - run: ./mvnw -B verify

  geo-api:
    needs: changes
    if: ${{ needs.changes.outputs.geo-api == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/geo-api
    # Fase 2 (spec 02) passou a exigir Postgres de verdade nos testes (map matching e
    # agregação escrevem no banco) — imagem com PostGIS, igual ao docker-compose local,
    # porque os testes usam ST_DWithin/geometry (Postgres puro não tem essas funções).
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: autonomousapi
          POSTGRES_PASSWORD: autonomousapi
          POSTGRES_DB: autonomousapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GEO_DB_URL: postgresql+psycopg://autonomousapi:autonomousapi@localhost:5432/autonomousapi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: alembic upgrade head
      - run: pytest -q
      # Contrato interno code-first (ADR 0002): gera o OpenAPI do código e compara
      # com o snapshot commitado em packages/contracts/internal/geo-api.openapi.json
      # — falha se divergir (fonte de verdade é o código, snapshot precisa ser
      # regenerado e commitado junto de qualquer PR que mude uma rota/model do
      # geo-api). Gerado no mesmo Python 3.12 do job pra não dar falso positivo por
      # diferença de ambiente entre quem gerou o snapshot e o CI.
      - name: Gerar OpenAPI interno do geo-api
        run: python scripts/export_openapi.py /tmp/geo-api.openapi.json
      - name: Verificar drift contra o snapshot commitado
        run: |
          if ! diff -u ../../packages/contracts/internal/geo-api.openapi.json /tmp/geo-api.openapi.json; then
            echo "::error::O OpenAPI do geo-api mudou mas o snapshot commitado não foi atualizado."
            echo "Rode 'python scripts/export_openapi.py ../../packages/contracts/internal/geo-api.openapi.json' em services/geo-api e commite o resultado."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: geo-api-openapi
          path: /tmp/geo-api.openapi.json

  contracts:
    needs: changes
    if: ${{ needs.changes.outputs.contracts == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run contracts:validate
