# Deploy do apps/web (painel do gestor). Monorepo com npm workspaces — `base` aponta
# o build pra dentro de apps/web, mas o `npm ci` roda a partir da raiz do repo (onde
# está o package-lock.json), senão os workspaces não resolvem.
[build]
  base = "apps/web"
  command = "npm ci --prefix ../.. && npm run build"
  publish = "dist"

# Proxy de /api pro core-api (Oracle Cloud, piloto): o client (src/api/client.ts)
# só fala com "/api", igual em dev (onde é o Vite que proxya, ver vite.config.ts) —
# aqui é o Netlify que faz o mesmo papel, evitando CORS (mesma origem do ponto de
# vista do browser). Precisa vir ANTES do fallback de SPA abaixo, senão o catch-all
# de "/*" engole as chamadas de API. Troca o host quando tiver domínio próprio.
[[redirects]]
  from = "/api/*"
  to = "https://163-176-224-227.sslip.io/:splat"
  status = 200
  force = true

# Fallback de SPA (spec pendente desde o PR de migração pra React Router): sem isso,
# F5 ou link direto numa rota tipo /frota/:id devolve 404 do Netlify em vez de deixar
# o React Router decidir o que mostrar.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
