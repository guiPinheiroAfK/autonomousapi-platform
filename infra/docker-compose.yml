name: autonomousapi

# Ambiente local: um Postgres+PostGIS compartilhado (schemas core + geo) e os dois serviços.
# Sobe com: docker compose -f infra/docker-compose.yml up --build
#
# O web (apps/web) roda via `npm run dev:web` (proxy /api -> core-api), fora do compose,
# para preservar hot-reload — ver infra/README.md.

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: autonomousapi
      POSTGRES_PASSWORD: autonomousapi
      POSTGRES_DB: autonomousapi
    ports:
      # Publica em 5433 no host para não colidir com um Postgres local (que usa 5432).
      # A comunicação entre serviços é interna (db:5432) e não depende deste publish.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autonomousapi -d autonomousapi"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    # Sem publish no host: só o core-api usa, pela rede do compose. Sem volume também —
    # o que guardamos aqui (contador de rate limit, cache de agregado) é descartável por
    # definição; perder no restart apenas significa recontar/recalcular.
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Motor de roteamento (spec 02). Fica atrás do profile `routing` de propósito: o
  # osrm-routed morre em loop se o grafo não existir, e preparar o grafo é um passo
  # manual (~30s, precisa de rede) que não faz sentido impor a quem só quer subir o
  # painel:
  #
  #   cd services/geo-api && python scripts/prepare_osrm_graph.py
  #   docker compose -f infra/docker-compose.yml --profile routing up -d osrm
  #
  # Sem ele no ar, o geo-api responde "roteamento indisponível" — degradação explícita,
  # não erro (mesmo padrão do provedor de recarga, do SMTP e da Stripe).
  osrm:
    image: ghcr.io/project-osrm/osrm-backend
    profiles: ["routing"]
    command: osrm-routed --algorithm mld /data/pilot
    volumes:
      - ./osrm/data:/data:ro
    # Interno como o geo-api: só o geo-api fala com o OSRM, pela rede do compose.
    expose:
      - "5000"

  geo-api:
    build:
      context: ../services/geo-api
    environment:
      GEO_DB_URL: postgresql+psycopg://autonomousapi:autonomousapi@db:5432/autonomousapi
      GEO_SERVICE_TOKEN: ${GEO_SERVICE_TOKEN:-dev-service-token-change-me}
      GEO_OSRM_URL: ${GEO_OSRM_URL:-http://osrm:5000}
    depends_on:
      db:
        condition: service_healthy
    # Sem publish de porta no host: o geo-api é INTERNO (spec 01). Só o core-api o
    # acessa, pela rede do compose (http://geo-api:8000). Não é exposto para fora.
    expose:
      - "8000"

  core-api:
    build:
      context: ../services/core-api
    environment:
      CORE_DB_URL: jdbc:postgresql://db:5432/autonomousapi
      CORE_DB_USER: autonomousapi
      CORE_DB_PASSWORD: autonomousapi
      CORE_JWT_SECRET: ${CORE_JWT_SECRET:-dev-only-secret-change-me-please-0123456789abcdef}
      # A application.yml já lia esta variável; faltava o compose repassá-la. Útil para
      # sessão longa em demonstração/depuração sem recompilar (o padrão segue 15 min).
      CORE_JWT_ACCESS_TTL_MIN: ${CORE_JWT_ACCESS_TTL_MIN:-15}
      GEO_API_URL: http://geo-api:8000
      GEO_SERVICE_TOKEN: ${GEO_SERVICE_TOKEN:-dev-service-token-change-me}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Vazio por padrão (sem seed). Rode `CORE_PROFILES=demo docker compose ... up`
      # para popular dado de demonstração (com.autonomousapi.core.demo.DemoDataSeeder).
      SPRING_PROFILES_ACTIVE: ${CORE_PROFILES:-}
      # Confirmação de e-mail (ADR 0011). Vazio por padrão: o link de verificação só
      # aparece no log do container (`docker compose logs core-api`), sem enviar de
      # verdade — nenhuma credencial de provedor SMTP é necessária para testar o fluxo.
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SMTP_USER: ${MAIL_SMTP_USER:-}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@autonomousapi.com.br}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:5180}
    depends_on:
      db:
        condition: service_healthy
      geo-api:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  pgdata:
